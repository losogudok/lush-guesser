name: 🐛 Что-то работает не так
description: Игра ведёт себя не так, как вы ожидали. Никаких технических знаний не нужно.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что сообщаете! Заполните простыми словами — вы не обязаны понимать, почему так произошло.
        Чем конкретнее пример ("нажала кнопку X, увидела Y, а ожидала Z"), тем быстрее починим.

  - type: textarea
    id: what-happened
    attributes:
      label: Что произошло?
      description: Опишите своими словами, что случилось.
      placeholder: Например — в конце игры счёт показал 0, хотя я угадала 7 продуктов.
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: А что должно было произойти?
      description: Как вы считаете, как правильно?
      placeholder: Например — счёт должен быть 7, потому что я угадала 7 из 10.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Критерии приёмки
      description: По каким проверяемым результатам будет понятно, что ошибка исправлена? Каждый пункт — отдельное условие.
      placeholder: |
        - [ ] После описанных шагов игра показывает ожидаемый результат.
        - [ ] Повторная игровая сессия работает без этой ошибки.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Зависимости
      description: >-
        Какие задачи нужно завершить сначала? Укажите номера в формате «Blocked by: #123, #456».
        Если зависимостей нет, напишите «Нет». Если не уверены — «Нужна проверка».
      placeholder: |
        Blocked by: #123
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Как это повторить?
      description: По шагам, как в рецепте. Каждый шаг — отдельное действие.
      placeholder: |
        1. Открыл игру
        2. Начал новую игру
        3. В третьем раунде открыл все подсказки
        4. Увидел то, что описал выше
    validations:
      required: true

  - type: dropdown
    id: when
    attributes:
      label: Как часто это происходит?
      options:
        - Каждый раз
        - Иногда
        - Был один раз
        - Не знаю
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Скриншот или запись экрана (если есть)
      description: Картинка стоит тысячи слов. Перетащите файл прямо в это поле.
    validations:
      required: false

  - type: textarea
    id: where
    attributes:
      label: Где и на чём вы играли?
      description: Просто опишите — телефон или компьютер, какой браузер или приложение.
      placeholder: Например — телефон, Safari, iPhone
    validations:
      required: false

  - type: textarea
    id: anything-else
    attributes:
      label: Что-нибудь ещё?
      description: Любые детали, которые кажутся вам важными.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### Подготовка к работе агента
        Новая задача получает метку `needs-triage`. При разборе нужно уточнить ожидаемое поведение, критерии приёмки и зависимости.
        Для запуска Sandcastle задача должна быть открыта, без назначенного исполнителя и с меткой `ready-for-agent`.
        Все блокирующие задачи должны быть закрыты. При возможности оформите зависимости через GitHub; иначе оставьте в описании строку `Blocked by: #123`.
        Перед добавлением `ready-for-agent` снимите конфликтующие метки: `needs-triage`, `needs-info`, `ready-for-human`, `wontfix`.
