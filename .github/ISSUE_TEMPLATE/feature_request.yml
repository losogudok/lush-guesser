name: 💡 Идея или предложение
description: Хотите что-то изменить в игре, правилам или добавить новое? Расскажите!
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за идею! Не нужно писать «как это сделать технически» — просто расскажите, что хотите получить и зачем.

  - type: dropdown
    id: kind
    attributes:
      label: О чём ваша идея?
      description: Выберите, что ближе всего.
      options:
        - Новая механика игры (правила, раунды, подсказки)
        - Изменение существующих правил
        - Что-то про продукты / ингредиенты / контент
        - Что-то про таблицу лидеров
        - Удобство и внешний вид (интерфейс)
        - Другое
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Какую проблему решает идея?
      description: Что сейчас неудобно, скучно или непонятно? Можно написать «проблемы нет, просто хочется».
      placeholder: Например — когда все подсказки открыты, угадывать слишком легко.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Ожидаемое поведение
      description: >-
        Опишите, как должна работать игра: что делает игрок и какой результат получает.
        Технические детали не обязательны.
      placeholder: Например — если открыл все подсказки, очков даётся меньше.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Критерии приёмки
      description: По каким проверяемым результатам будет понятно, что идея реализована? Каждый пункт — отдельное условие.
      placeholder: |
        - [ ] При описанном действии игрок получает ожидаемый результат.
        - [ ] Новое поведение работает в следующей игровой сессии.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Зависимости
      description: >-
        Какие задачи нужно завершить сначала? Укажите номера в формате «Blocked by: #123, #456».
        Если зависимостей нет, напишите «Нет». Если не уверены — «Нужна проверка».
      placeholder: |
        Blocked by: #123
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: Есть ли другие варианты?
      description: Если думали о других способах решить ту же проблему — напишите здесь.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Примеры, картинки, ссылки (если есть)
      description: Скриншоты, наброски, похожие игры — всё поможет понять идею.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### Подготовка к работе агента
        Новая задача получает метку `needs-triage`. При разборе нужно уточнить ожидаемое поведение, критерии приёмки и зависимости.
        Для запуска Sandcastle задача должна быть открыта, без назначенного исполнителя и с меткой `ready-for-agent`.
        Все блокирующие задачи должны быть закрыты. При возможности оформите зависимости через GitHub; иначе оставьте в описании строку `Blocked by: #123`.
        Перед добавлением `ready-for-agent` снимите конфликтующие метки: `needs-triage`, `needs-info`, `ready-for-human`, `wontfix`.
