name: CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test product catalog
        working-directory: frontend
        run: npm run test:catalog

      - name: Validate product catalog
        working-directory: frontend
        run: npm run validate:catalog

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Lint server
        working-directory: server
        run: npm run lint

      - name: Test server
        working-directory: server
        run: npm test -- --passWithNoTests

      - name: Test server e2e
        working-directory: server
        run: npm run test:e2e

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npm run test:e2e

  production-build:
    name: Production Docker build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production images
        run: docker compose build

      - name: Verify Leaderboard Entry persistence
        run: ./scripts/check-leaderboard-persistence.sh

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: production-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          envs: GITHUB_SHA,DEPLOY_PATH
          script: |
            cd "$DEPLOY_PATH"
            migration_started=0
            restart_backend_on_failure() {
              status=$?
              if [ "$status" -ne 0 ] && [ "$migration_started" -eq 1 ]; then
                docker compose up -d backend || true
              fi
              exit "$status"
            }
            trap restart_backend_on_failure EXIT
            volume_name="lush-guesser-leaderboard-data"
            docker volume create "$volume_name" >/dev/null
            if [ -f data/database.sqlite ] && ! docker run --rm -v "$volume_name:/target" alpine:3.21 test -f /target/database.sqlite; then
              migration_started=1
              docker compose stop backend
              docker run --rm -v "$PWD/data/database.sqlite:/source/database.sqlite:ro" -v "$volume_name:/target" alpine:3.21 cp /source/database.sqlite /target/database.sqlite
            fi
            git fetch --prune origin
            git checkout --force "$GITHUB_SHA"
            git reset --hard "$GITHUB_SHA"
            docker compose up -d --build --remove-orphans
            migration_started=0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
