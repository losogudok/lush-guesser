name: CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promotion-policy:
    name: Promotion policy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Require dev as the production source branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_BRANCH" != "dev" ]; then
            echo "Production changes must be promoted from dev, not $HEAD_BRANCH." >&2
            exit 1
          fi

  quality:
    name: Test, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test product catalog
        working-directory: frontend
        run: npm run test:catalog

      - name: Validate product catalog
        working-directory: frontend
        run: npm run validate:catalog

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Lint server
        working-directory: server
        run: npm run lint

      - name: Test server
        working-directory: server
        run: npm test -- --passWithNoTests

      - name: Test server e2e
        working-directory: server
        run: npm run test:e2e

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npm run test:e2e

  production-build:
    name: Production Docker build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production images
        run: docker compose build

      - name: Verify Leaderboard Entry persistence
        run: ./scripts/check-leaderboard-persistence.sh

  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: production-build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Report disabled deployment
        if: vars.DEPLOY_ENABLED != 'true'
        run: >-
          echo "Deployment to ${{ github.ref_name }} is disabled until DNS, TLS, and host
          provisioning are verified."

      - name: Deploy over SSH
        id: deploy
        if: vars.DEPLOY_ENABLED == 'true'
        uses: appleboy/ssh-action@v1.2.2
        env:
          GITHUB_SHA: ${{ github.sha }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          FRONTEND_SOCKET_DIR: ${{ vars.FRONTEND_SOCKET_DIR }}
          LEADERBOARD_VOLUME_NAME: ${{ vars.LEADERBOARD_VOLUME_NAME }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 45m
          envs: GITHUB_SHA,REPOSITORY_URL,DEPLOY_PATH,COMPOSE_PROJECT_NAME,FRONTEND_SOCKET_DIR,LEADERBOARD_VOLUME_NAME
          script: |
            set -Eeuo pipefail
            : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
            : "${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}"
            : "${FRONTEND_SOCKET_DIR:?FRONTEND_SOCKET_DIR is required}"
            : "${LEADERBOARD_VOLUME_NAME:?LEADERBOARD_VOLUME_NAME is required}"
            exec 9>/run/lock/lush-guesser-deploy.lock
            flock -w 2700 9

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              install -d -m 0755 "$(dirname "$DEPLOY_PATH")"
              git clone --no-checkout "$REPOSITORY_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            install -d -m 0755 .deploy
            if [ -s .deploy/deployed-sha ]; then
              cp .deploy/deployed-sha .deploy/previous-sha
            else
              rm -f .deploy/previous-sha
            fi

            git fetch --prune origin
            git checkout --force "$GITHUB_SHA"
            git reset --hard "$GITHUB_SHA"
            ./scripts/deploy-environment.sh

      - name: Verify public frontend and API
        id: public-health
        if: vars.DEPLOY_ENABLED == 'true' && steps.deploy.conclusion == 'success'
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          : "${DEPLOY_URL:?DEPLOY_URL is required}"
          for _ in {1..30}; do
            if curl --fail --silent --show-error "$DEPLOY_URL/" >/dev/null && \
              curl --fail --silent --show-error \
                --output /dev/null --write-out '%{content_type}' \
                "$DEPLOY_URL/api/leaderboard?limit=1" | grep -qi '^application/json'; then
              echo "$DEPLOY_URL is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "$DEPLOY_URL did not become healthy." >&2
          exit 1

      - name: Roll back failed deployment
        id: rollback
        if: failure() && vars.DEPLOY_ENABLED == 'true'
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          FRONTEND_SOCKET_DIR: ${{ vars.FRONTEND_SOCKET_DIR }}
          LEADERBOARD_VOLUME_NAME: ${{ vars.LEADERBOARD_VOLUME_NAME }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 45m
          envs: DEPLOY_PATH,COMPOSE_PROJECT_NAME,FRONTEND_SOCKET_DIR,LEADERBOARD_VOLUME_NAME
          script: |
            set -Eeuo pipefail
            : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
            : "${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}"
            : "${FRONTEND_SOCKET_DIR:?FRONTEND_SOCKET_DIR is required}"
            : "${LEADERBOARD_VOLUME_NAME:?LEADERBOARD_VOLUME_NAME is required}"
            exec 9>/run/lock/lush-guesser-deploy.lock
            flock -w 2700 9
            cd "$DEPLOY_PATH"
            ./scripts/rollback-environment.sh

      - name: Verify rollback publicly
        if: failure() && steps.rollback.conclusion == 'success'
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          curl --fail --show-error --silent "$DEPLOY_URL/" >/dev/null
          curl --fail --show-error --silent \
            --output /dev/null --write-out '%{content_type}' \
            "$DEPLOY_URL/api/leaderboard?limit=1" | grep -qi '^application/json'
          echo "Rollback is healthy at $DEPLOY_URL."
