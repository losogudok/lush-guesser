services:
  backend:
    image: node:24-slim
    container_name: lush-guesser-backend-dev
    working_dir: /app
    command:
      - sh
      - -c
      - >-
        if [ ! -x node_modules/.bin/nest ]; then
          npm ci --fetch-retries=10 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=30000;
        fi && exec npm run start:dev
    ports:
      - "3001:3001"
    environment:
      DATABASE_PATH: /app/data/database.sqlite
      NODE_ENV: development
    volumes:
      - ./server:/app
      - ./data:/app/data
      - backend_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:3001/api/leaderboard?limit=1',
          (res) => process.exit(res.statusCode === 200 ? 0 : 1))
          .on('error', () => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    image: node:24-slim
    container_name: lush-guesser-frontend-dev
    working_dir: /app
    command:
      - sh
      - -c
      - >-
        if [ ! -x node_modules/.bin/vite ]; then
          npm ci --fetch-retries=10 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=30000;
        fi && exec npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:3001
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_node_modules:
  frontend_node_modules:
