services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME:-lush-guesser-backend}
    ports:
      - "${BACKEND_HOST_PORT:-3001}:3001"
    environment:
      - DATABASE_PATH=/app/data/database.sqlite
      - NODE_ENV=production
    volumes:
      - leaderboard_data:/app/data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lush-guesser-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  leaderboard_data:
    name: ${LEADERBOARD_VOLUME_NAME:-lush-guesser-leaderboard-data}
