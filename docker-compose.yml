services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - DATABASE_PATH=/app/data/database.sqlite
      - NODE_ENV=production
    volumes:
      - leaderboard_data:/app/data
    restart: always
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:3001/api/leaderboard?limit=1',
          (res) => process.exit(res.statusCode === 200 ? 0 : 1))
          .on('error', () => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${FRONTEND_SOCKET_DIR:-/tmp/lush-guesser}
        target: /run/lush-guesser
    restart: always

volumes:
  leaderboard_data:
    name: ${LEADERBOARD_VOLUME_NAME:-lush-guesser-leaderboard-data}
